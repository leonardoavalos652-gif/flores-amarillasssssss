<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Flowers</title>
</head>

<body>
    <!-- Contenedor donde JavaScript hará llover las flores -->
    <div class="falling-flowers"></div>

    <div class="greetings">
        <span>H</span>
        <span>o</span>
        <span>l</span>
        <span>a</span>
        <span> </span>
        <span>L</span>
        <span>e</span>
        <span>ó</span>
        <span>n</span>
        <span>!</span>
    </div>
    <div class="description">
        <span>CON MUCHO CARIÑO, PARA TI :)</span>
    </div>
    <div class="button">
        <button class="botones">
            <a href="flower.html" style="color: #fff;">CLICK AQUÍ</a>
        </button>
    </div>

    <!-- Script para crear las flores automáticamente al cargar -->
    <script>
        const container = document.querySelector('.falling-flowers');
        const tiposFlores = ['🌻', '🌷', '🌼', '💐'];
        
        for (let i = 0; i < 25; i++) {
            let span = document.createElement('span');
            span.innerHTML = tiposFlores[Math.floor(Math.random() * tiposFlores.length)];
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDuration = (Math.random() * 5 + 5) + 's';
            span.style.animationDelay = (Math.random() * 5) + 's';
            span.style.fontSize = (Math.random() * 1.5 + 1.5) + 'rem';
            container.appendChild(span);
        }
    </script>
</body>

</html>
